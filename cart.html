<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Trinaari Fashions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart-style.css">
</head>
<body>

    <div class="cart-page-wrapper section-padding">
        <div class="container">
            <h1 class="section-title">Your <span class="accent-text">Shopping Bag</span></h1>
            
            <div class="cart-flex-container">
                <div class="cart-items-list">
                    <div class="cart-item">
                        <div class="cart-item-img">
                            <img src="images/shop_by_categories1.webp" alt="Saree">
                        </div>
                        <div class="cart-item-details">
                            <div class="detail-header">
                                <h3>Banarasi Silk Heritage Saree</h3>
                                <button class="remove-item">✕</button>
                            </div>
                            <p class="item-meta">Category: Sarees | Color: Emerald Green</p>
                            <div class="qty-price-row">
                                <div class="qty-selector">
                                    <button>-</button>
                                    <input type="text" value="1" readonly>
                                    <button>+</button>
                                </div>
                                <p class="item-total-price">₹ 12,500</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="cart-summary-section">
                    <div class="summary-card">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>₹ 12,500</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span class="free-text">FREE</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total Amount</span>
                            <span>₹ 12,500</span>
                        </div>
                        
                        <button class="checkout-btn">PROCEED TO CHECKOUT</button>
                        
                        <div class="trust-badges">
                            <p>✓ Secure Payments</p>
                            <p>✓ Genuine Handcrafted Products</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
