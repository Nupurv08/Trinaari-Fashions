<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | Trinaari Fashions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <div class="admin-login-wrapper">
        <div class="admin-glow-1"></div>
        <div class="admin-glow-2"></div>

        <div class="admin-card">
            <div class="admin-header">
                <div class="admin-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>SECURE ACCESS</span>
                </div>
                <h1 class="brand-name">TRINAARI</h1>
                <p class="admin-tagline">Management Portal</p>
            </div>

            <form action="#" class="admin-form">
                <div class="admin-input-group">
                    <input type="text" id="admin-id" placeholder="Administrator ID" required>
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                </div>

                <div class="admin-input-group">
                    <input type="password" id="admin-pass" placeholder="Secret Key" required>
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                </div>

                <button type="submit" class="btn-admin-login">
                    ENTER DASHBOARD
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="admin-footer">
                <a href="index.html">← Public Terminal</a>
                <p>© 2026 Admin System v1.0</p>
            </div>
        </div>
    </div>

</body>
</html>
