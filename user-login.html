<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Trinaari Fashions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> </head>
<body class="login-page-body">

    <div class="login-container">
        <div class="login-box">
            <div class="login-visual">
                <div class="visual-overlay">
                    <img src="images\tinaarilogo.webp" alt="Trinaari Logo" class="login-logo-img">
                    <h2>Welcome Back</h2>
                    <p>Experience the heritage of elegance once again.</p>
                </div>
            </div>

            <div class="login-form-content">
                <div class="form-header">
                    <h1 class="brand-name">TRINAARI</h1>
                    <p class="form-subtitle">Login to your account</p>
                </div>

                <form action="#" class="auth-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <div class="label-wrapper">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot?</a>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-login-submit">SIGN IN</button>
                    
                    <div class="form-divider">
                        <span>OR</span>
                    </div>

                    <p class="switch-auth">
                        Don't have an account? <a href="register.html">Create One</a>
                    </p>
                </form>

                <div class="back-home">
                    <a href="index.html">← Back to Boutique</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
