                /* --- Variables for Theme Consistency --- */
:root {

    --trinaari-cream: #fbf9f4;
}

/* --- Category Title Style (As per image) --- */
.category-main-title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    color: var(--trinaari-green);
    margin-top: 40px;
    letter-spacing: 2px;
}

.category-underline {
    width: 60px;
    height: 3px;
    background: var(--trinaari-gold);
    margin: 10px auto 40px;
}

/* --- Luxury Product Grid --- */
.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 Columns as per Pink Panther structure */
    gap: 30px;
}

/* --- Product Card - Refined & Premium --- */
.product-card-luxury {
    background: #fff;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    text-align: center;
}

.product-image-wrapper {
    position: relative;
    aspect-ratio: 1 / 1.3; /* Editorial Saree Crop */
    overflow: hidden;
    background: var(--trinaari-cream);
}

.saree-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1s ease;
}

.product-card-luxury:hover .saree-img {
    transform: scale(1.08);
}

/* Card Hover Overlay */
.card-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 61, 46, 0.7); /* Green tint on hover */
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 0.4s ease;
}

.product-card-luxury:hover .card-overlay {
    opacity: 1;
}

.action-link {
    color: #fff;
    text-decoration: none;
    border: 1px solid var(--trinaari-gold);
    padding: 10px 20px;
    font-size: 11px;
    letter-spacing: 2px;
    background: rgba(197, 160, 89, 0.1);
    transition: 0.3s;
}

.action-link:hover {
    background: var(--trinaari-gold);
    color: var(--trinaari-green);
}

.product-details-luxury {

}

.saree-price {

@media (max-width: 768px) {
