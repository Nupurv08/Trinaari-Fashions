<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy | TRINAARI</title>
    <style>
        :root {
            --brand-gold: #c5a059; /* Aap apne brand color ke hisaab se change kar sakte hain */
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .policy-container {
            background: white;
            max-width: 800px;
            width: 90%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: var(--brand-gold);
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            margin-bottom: 30px;
            color: #666;
        }
        .pdf-viewer {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .btn-download {
            display: inline-block;
            background-color: var(--brand-gold);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn-download:hover {
            opacity: 0.8;
        }
        .back-home {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="policy-container">
        <h1>TRINAARI</h1>
        <h3>Privacy Policy</h3>
        <iframe src="https://docs.google.com/document/d/1Uid4crckSu_R1w8XLHHrvsSOEEINUehSDAeAAgkTWrw/edit?tab=t.0#heading=h.cns04vwvyxko" class="pdf-viewer"></iframe>

        <br>

        <a href="https://docs.google.com/document/d/1Uid4crckSu_R1w8XLHHrvsSOEEINUehSDAeAAgkTWrw/edit?tab=t.0#heading=h.cns04vwvyxko" class="btn-download">
            Download Privacy Policy (PDF)
        </a>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

</body>
</html>
